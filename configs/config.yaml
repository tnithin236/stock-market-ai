data:
  ticker: AAPL
  start_date: "2015-01-01"
  end_date: "2026-10-15"  # EXCLUSIVE end: freezes the dataset (last bar = 2026-10-14) so every run is reproducible; null = up to today
  interval: 1d
  raw_dir: data/raw
  processed_dir: data/processed
  cache_max_age_hours: 24

paths:
  figures_dir: reports/figures
  models_dir: models
  reports_dir: reports

eda:
  ma_windows: [20, 50, 200]
  vol_window: 21          # ~1 trading month
  acf_lags: 30

features:
  sma_windows: [10, 20, 50]
  ema_windows: [10, 20, 50]
  rsi_window: 14
  macd: {fast: 12, slow: 26, signal: 9}
  bollinger: {window: 20, num_std: 2.0}
  atr_window: 14
  vol_windows: [10, 20]
  momentum_windows: [5, 10]
  price_lags: [1, 2, 3, 5]
  return_lags: [1, 2, 3, 5]
  volume_ma_window: 20

split:
  train_frac: 0.70
  val_frac: 0.15          # test = remaining 15%
  gap: 1                  # rows dropped between sets (label of day t uses day t+1)

scaling:
  method: standard        # standard | robust

baselines:
  ma_windows: [10, 20]    # must exist in features.sma_windows

xgboost:
  n_estimators: 500           # upper bound; early stopping picks the real number
  early_stopping_rounds: 50   # stop when validation loss has not improved for 50 rounds
  seed: 42
  use_class_weight: true      # scale_pos_weight = n_down / n_up on the training set
  params:
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
  tuning:
    n_trials: 30

lstm:
  feature_set: scale_free      # scale_free (22 inputs) | all (44 inputs)
  seq_len: 30                  # trading days of history per sample
  hidden_size: 32
  num_layers: 1
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10                 # early stopping (epochs without validation improvement)
  lr_patience: 3               # ReduceLROnPlateau patience
  lr_factor: 0.5
  grad_clip: 1.0
  clip_scaled: 5.0             # clip standardized features to +/- 5 sigma
  seed: 42
  use_class_weight: true
  tuning:
    n_trials: 12
    seq_len_choices: [10, 20, 30, 60]
    max_epochs: 40
  permutation:
    n_repeats: 5

transformer:
  feature_set: scale_free
  seq_len: 30
  d_model: 32                  # embedding dimension (must be divisible by nhead)
  nhead: 4                     # attention heads
  num_layers: 2                # encoder blocks
  dim_feedforward: 64
  dropout: 0.1
  lr: 0.0005
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10
  lr_patience: 3
  lr_factor: 0.5
  grad_clip: 1.0
  clip_scaled: 5.0
  seed: 42
  use_class_weight: true
  tuning:
    n_trials: 12
    seq_len_choices: [10, 20, 30, 60]
    max_epochs: 40
  permutation:
    n_repeats: 5

backtest:
  initial_capital: 100000
  cost_bps: 5                  # one-way cost per unit of turnover (commission + slippage), in basis points
  execution: next_open         # next_open (signal at close t, trade at open t+1) | same_close (idealised)
  sizing: binary               # binary (all-in / flat) | scaled (position grows with the probability edge)
  scale: 10                    # scaled sizing: position = clip((prob - threshold) * scale, lo, 1)
  threshold: 0.5
  allow_short: false           # long/flat by default; shorting adds borrow costs we do not model
  cost_sensitivity_bps: [0, 5, 10, 25]
  random_trials: 1000          # random-signal null distribution with the same average exposure
  risk_free_annual: 0.0
  seed: 42
